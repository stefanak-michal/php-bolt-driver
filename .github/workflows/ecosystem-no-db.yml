name: Tests without a database PHP^8

on:
  workflow_call:

jobs:
  no-db-tests:
    runs-on: ubuntu-latest
    name: "Running Tests for PHP ${{ matrix.php-version }}"
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5', '8.6']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, sockets
          coverage: xdebug
          ini-values: max_execution_time=0, variables_order="EGPCS"

      - name: Remove dresscode on PHP < 8.4
        if: matrix.php-version < '8.4'
        run: composer remove --dev --no-update dresscode/dresscode

      - name: Install dependencies
        run: composer install --no-progress

      - name: Test with phpunit
        run: vendor/bin/phpunit --configuration phpunit.xml --testsuite "NoDatabase"
